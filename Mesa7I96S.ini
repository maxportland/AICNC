#******************************************
# Power drawbar: four pneumatic cylinders (valve on 7i84 output 5, driven by M64/M65 P0) lower the
# motor (joint 3, A) onto the drawbar's square, and the motor turns it. The motor is a closed-loop
# stepper (34HS39-6004D-E1K, 1000-line encoder = 4000 counts a turn) on a CL86Y driver: its ALM is
# 7i84 input 5 (a joint 3 amp fault) and its ENA is 7i84 output 7 (see Mesa7I96S.hal). Used by the subroutines
# drawbar_release / drawbar_clamp / drawbar_lower / drawbar_raise, the M6 remap (milo_m6) and the
# Tools page. COMMISSION THESE AT THE MACHINE (Tools page -> Drawbar test) before trusting them.
[DRAWBAR]
# The A axis is the drawbar (the screen hides it, Milo never moves it)
AXIS = A
# 1 if output on (M64 P0) lowers the motor onto the drawbar, 0 if output on raises it
LOWER_IS_ON = 1
# 1 if turning A positive tightens the drawbar, -1 if negative tightens
TIGHTEN_DIRECTION = 1
# Turns to undo the drawbar, and to do it back up. The closed-loop driver doesn't stall quietly when
# the drawbar is tight: it pushes at its peak current (that's the clamp torque: set it in the CL86Y's
# tuning software) and alarms once it falls further behind than its position error limit, which faults
# the machine. So CLAMP_TURNS is the turns back to tight plus a little to load it, and the driver's
# position error limit (tuning software) must be more than that little: e.g. 0.25 turn over, limit
# 2000 counts (half a turn). Measure the turns to tight when commissioning and set this to suit.
RELEASE_TURNS = 3
CLAMP_TURNS = 3.25
# Turns per second while releasing / tightening (slower is more torque, even closed loop)
TURN_SPEED = 1.5
# While the cylinders push the motor down, turn this far, slowly, so the square finds the drawbar
ENGAGE_TURNS = 0.3
ENGAGE_SPEED = 0.25
# Seconds for the cylinders to go down / up, and for the spindle to stop before engaging
LOWER_TIME = 1.0
RAISE_TIME = 1.0
SPINDLE_STOP_TIME = 3.0

[SPINDLE_0]
P = 10
I = 0.1
D = 0
FF0 = 1
FF1 = 0
FF2 = 0
BIAS = 0
DEADBAND = 0
OUTPUT_SCALE = 3000
MAX_OUTPUT = 3000
OUTPUT_MIN_LIMIT = 0
OUTPUT_MAX_LIMIT = 3000

# The tool setter (Measure tool on the Tools and Probe pages; subprograms.py). The spindle goes to the
# top of Z, across to X/Y, then down to Z as a probe move at APPROACH_FEED (a tool too long for Z stops
# on the setter rather than hitting it), then searches down and probes slowly. The speeds, search
# distance, setter height and work height are screen settings (Probe page), not here.
[TOOL_SENSOR]
# Machine X/Y of the setter's centre, and the machine Z to start the search from
X = 5.446
Y = 78.012
Z = -130.00
# mm/min down to Z: slow enough to stop within the setter's overtravel if a long tool touches it
APPROACH_FEED = 600

[PROBE]
USE_PROBE = basicprobe

