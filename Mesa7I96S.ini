MDI_COMMAND = G53 G0 Z-10;G53 G0 X250 Y87.5;, Center Machine
MDI_COMMAND = M3 S1000, Spindle 1000
MDI_COMMAND = M3 S2500, Spindle 2500

[FILTER]
PROGRAM_EXTENSION = .ngc,.nc G-Code file (*.ngc,*.nc)
PROGRAM_EXTENSION = .py Python Script
py = python

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE = linuxcnc.var
RS274NGC_STARTUP_CODE = G21 G40 G90 G94 G97 G64 P0.025
SUBROUTINE_PATH = ./subroutines

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[HMOT]
