LOG_FILE = ruckus_log.log
# Milo (the AI assistant) is built into the screen; see milo_ui/ and milo_engine.py

[MDI_COMMAND_LIST]
MDI_COMMAND = G0 Z0;X0 Y0, Go to G54
MDI_COMMAND = G0 X0 Y0, Go to X/Y G54
MDI_COMMAND = G53 G0 Z0;G53 G0 X0 Y0, ABS Home
MDI_COMMAND = M3 S250;G4 P1.0;M3 S500;G4 P1.0;M3 S750;G4 P1.0;M3 S1000;G4 P1.0;M3 S1250;G4 P1.0;M3 S1500;G4 P1.0;M3 S1750;G4 P1.0;M3 S2000, Spindle Test
